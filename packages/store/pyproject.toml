[project]
name = "codegraph-store"
version = "0.0.1"
description = "Load codegraph fact runs into Neo4j."
license = "LGPL-2.1-or-later"
requires-python = ">=3.13"
dependencies = ["codegraph-schema", "neo4j>=6.4,<7"]

[project.scripts]
cg-load = "codegraph_store.cli:main"

[tool.uv.sources]
codegraph-schema = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "codegraph_store"
