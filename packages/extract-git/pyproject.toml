[project]
name = "codegraph-extract-git"
version = "0.0.1"
description = "git history extractor: churn, authors, co-change."
requires-python = ">=3.13"
dependencies = ["codegraph-schema"]

[project.scripts]
cg-extract-git = "codegraph_extract_git:main"

[tool.uv.sources]
codegraph-schema = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "codegraph_extract_git"
