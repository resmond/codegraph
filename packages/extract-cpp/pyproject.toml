[project]
name = "codegraph-extract-cpp"
version = "0.0.1"
description = "libclang 21 extractor: FreeCAD C++ -> JSONL fact records."
requires-python = ">=3.13"
dependencies = ["codegraph-schema", "clang==21.1.7"]

[project.scripts]
cg-extract-cpp = "codegraph_extract_cpp.run:main"

[tool.uv.sources]
codegraph-schema = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "codegraph_extract_cpp"
